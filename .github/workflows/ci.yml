# Multi-Environment CI/CD Pipeline — Healthcare Backend
#
# TRIGGER FLOW:
#   push to preprod    → detect → security → docker-build → deploy PREPROD
#   PR  to main        → lint/type-check + promotion rule check (no deploy)
#   push to main       → detect → security → docker-build → deploy PRODUCTION
#
# PR-to-main checks:
#   - Lint + type-check
#   - Promotion rule (only preprod branch can merge into main)
#   - NO secrets, NO infra, NO deploy
#
# DEPLOY STRATEGY: Coolify rolling deploy for both environments.
# ============================================================================

name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [preprod, main]
    paths-ignore:
      - "**/*.md"
      - "**/*.svg"
      - "**/*.txt"

permissions:
  contents: read
  checks: write
  packages: write
  security-events: write
  actions: read

env:
  NODE_VERSION: "22"
  YARN_VERSION: "1.22.22"
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  IMAGE_NAME: healthcare-api
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -i ~/.ssh/deploy_key"
  HEALTH_INTERVAL: 5
  DRAIN_INTERVAL: 5
  HEALTH_TIMEOUT: 180
  DRAIN_TIMEOUT: 120

# ============================================================================
# JOB: detect-changes — Identify infra vs app changes
# ============================================================================
jobs:
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      infra-changed: ${{ steps.filter.outputs.infra }}
      app-changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect infrastructure and application changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            infra:
              - 'devops/docker/docker-compose.prod.yml'
              - 'devops/docker/docker-compose.preprod.yml'
              - 'devops/docker/nginx/*'
              - 'devops/scripts/docker-infra/*'
              - 'src/libs/infrastructure/database/prisma/migrations/**'
            app:
              - 'src/**'
              - 'package.json'
              - 'yarn.lock'
              - 'tsconfig.json'
              - 'nest-cli.json'
              - 'devops/docker/Dockerfile'

      - name: Change Summary
        run: |
          echo "## Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ steps.filter.outputs.infra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${{ steps.filter.outputs.app }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: pr-check — Fast validation for PRs targeting main (no deploy)
  # ============================================================================
  pr-check:
    name: "PR Validation"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn
        run: npm install -g yarn@${{ env.YARN_VERSION }} --force

      - name: Install dependencies
        run: yarn install --frozen-lockfile --silent

      - name: Lint
        run: yarn lint:check

      - name: Type-check
        run: yarn type-check

      - name: Enforce promotion flow
        run: |
          echo "PR: ${{ github.head_ref }} → ${{ github.base_ref }}"
          if [[ "${{ github.base_ref }}" != "main" ]]; then
            echo "::warning::PR targets ${{ github.base_ref }} — promotion rule only applies to main."
            exit 0
          fi
          if [[ "${{ github.head_ref }}" != "preprod" ]]; then
            echo "::error::Only the 'preprod' branch can merge into 'main'. Current head: ${{ github.head_ref }}"
            exit 1
          fi
          echo "Promotion flow valid: preprod → main."

      - name: PR check summary
        run: |
          echo "## PR Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: security — Vulnerability scan + dependency audit (push only)
  # ============================================================================
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

      - name: Dependency Audit
        run: |
          npx audit-ci@7.1.0 --moderate --config audit-ci.json
          echo "Dependency audit passed" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: docker-build — Build and push environment-tagged image to GHCR
  # ============================================================================
  docker-build:
    name: "Docker Build and Push"
    runs-on: ubuntu-latest
    needs: [detect-changes, security]
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_name: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn
        run: npm install -g yarn@${{ env.YARN_VERSION }} --force

      - name: Validate Prisma schema/migration sync
        run: |
          node scripts/validate-prisma-generated.js --check-migration-sync
          echo "Prisma schema/migration sync OK" >> $GITHUB_STEP_SUMMARY

      - name: Validate Prisma configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -f src/libs/infrastructure/database/prisma/schema.prisma || (echo "Schema file not found!" && exit 1)
          test -f src/libs/infrastructure/database/prisma/prisma.config.js || (echo "Config file not found!" && exit 1)
          yarn install --frozen-lockfile --ignore-scripts --silent
          yarn prisma format --schema=./src/libs/infrastructure/database/prisma/schema.prisma \
            --config=./src/libs/infrastructure/database/prisma/prisma.config.js \
            || (echo "Prisma schema validation failed!" && exit 1)
          echo "Prisma schema valid" >> $GITHUB_STEP_SUMMARY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        id: image
        run: |
          REPO_LOWER=$(echo "${{ env.IMAGE_REPO }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_FULL="ghcr.io/${REPO_LOWER}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE_FULL}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.ref == 'refs/heads/main' && 'main' || 'preprod' }}-${{ github.sha }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64

      - name: Ensure SHA tag exists
        run: |
          IMAGE_BASE="${{ steps.image.outputs.image }}"
          EXPECTED_TAG="${{ github.ref == 'refs/heads/main' && 'main' || 'preprod' }}-${{ github.sha }}"
          EXPECTED_IMAGE="${IMAGE_BASE}:${EXPECTED_TAG}"
          echo "Expected tag: ${EXPECTED_IMAGE}"
          echo "## Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${EXPECTED_TAG} | \`${EXPECTED_IMAGE}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Ensure branch tag points to latest image
        if: github.event_name == 'push'
        run: |
          IMAGE_BASE="${{ steps.image.outputs.image }}"
          SHA_TAG="${{ github.ref == 'refs/heads/main' && 'main' || 'preprod' }}-${{ github.sha }}"
          BRANCH_TAG="${{ github.ref == 'refs/heads/main' && 'main' || 'preprod' }}"
          echo "Ensuring :${BRANCH_TAG} → :${SHA_TAG}"
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${BRANCH_TAG}" \
            "${IMAGE_BASE}:${SHA_TAG}"
          echo "✅ :${BRANCH_TAG} now points to ${IMAGE_BASE}:${SHA_TAG}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: ensure-infrastructure-health — Check shared infra (push only)
  # ============================================================================
  ensure-infrastructure-health:
    name: "Ensure Infrastructure Health"
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push'
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    outputs:
      infra_healthy: ${{ steps.health.outputs.healthy }}
      infra_status: ${{ steps.health.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run infrastructure health check
        id: health
        continue-on-error: true
        env:
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
          CONTAINER_PREFIX: ${{ github.ref == 'refs/heads/main' && 'latest-' || 'preprod-' }}
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${DEPLOY_PATH}' && BASE_DIR='${DEPLOY_PATH}' DEPLOY_ENV='${DEPLOY_ENV}' CONTAINER_PREFIX='${CONTAINER_PREFIX}' devops/scripts/docker-infra/health-check.sh --env '${DEPLOY_ENV}'" > /tmp/health-result.json 2>&1 || true

          cat /tmp/health-result.json | sed 's/\\n/\n/g' > /tmp/health-pretty.json
          cat /tmp/health-pretty.json

          HEALTHY=$(cat /tmp/health-result.json | tr -d '\n' | grep -o '"status":"healthy"' || true)
          if [[ -n "$HEALTHY" ]]; then
            echo "healthy=true" >> $GITHUB_OUTPUT
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: Infra health summary
        run: |
          echo "Infrastructure health: ${{ steps.health.outputs.status }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: pre-deployment-backup — Backup before deploy (push only)
  # ============================================================================
  pre-deployment-backup:
    name: "Pre-Deploy Backup"
    runs-on: ubuntu-latest
    needs: [ensure-infrastructure-health]
    if: github.event_name == 'push'
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run pre-deployment backup
        env:
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${DEPLOY_PATH}' && BASE_DIR='${DEPLOY_PATH}' bash devops/scripts/docker-infra/backup.sh pre-deployment" | tee /tmp/pre-deploy-backup.log

  # ============================================================================
  # JOB: deploy — Rolling deploy with sustained health verification (push only)
  # ============================================================================
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: [docker-build, ensure-infrastructure-health, pre-deployment-backup]
    if: github.event_name == 'push'
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
      cancel-in-progress: false
    outputs:
      deploy_status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync deploy scripts to VPS
        env:
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          scp ${{ env.SSH_OPTS }} \
            "$GITHUB_WORKSPACE/devops/scripts/docker-infra/coolify-deploy.sh" \
            "$GITHUB_WORKSPACE/devops/scripts/docker-infra/health-check.sh" \
            "$GITHUB_WORKSPACE/devops/scripts/docker-infra/verify.sh" \
            "$GITHUB_WORKSPACE/devops/scripts/docker-infra/backup.sh" \
            "$GITHUB_WORKSPACE/devops/scripts/docker-infra/incident-response.sh" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${DEPLOY_PATH}/devops/scripts/docker-infra/"

          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p ${DEPLOY_PATH}/devops/config"
          scp ${{ env.SSH_OPTS }} \
            "$GITHUB_WORKSPACE/devops/config/coolify-apps.env" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${DEPLOY_PATH}/devops/config/"

      - name: Deploy via Coolify (GHCR image)
        id: deploy
        env:
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
          COOLIFY_APP_UUID: ${{ github.ref == 'refs/heads/main' && secrets.COOLIFY_PROD_APP_UUID || secrets.COOLIFY_PREPROD_APP_UUID }}
          IMAGE_FULL: ${{ needs.docker-build.outputs.image_name }}:${{ github.ref == 'refs/heads/main' && 'main' || 'preprod' }}-${{ github.sha }}
          INFRA_CHANGED: ${{ needs.detect-changes.outputs.infra-changed }}
          APP_CHANGED: ${{ needs.detect-changes.outputs.app-changed }}
        run: |
          echo "Deploying to: ${DEPLOY_ENV} (image: ${IMAGE_FULL})"

          # ── Gate: production deploys disabled until preprod is validated ────
          if [ "${DEPLOY_ENV}" = "production" ]; then
            if [ "${{ vars.ENABLE_PROD_DEPLOY || 'true' }}" != "true" ]; then
              echo "::warning::Production deploys are gated off. Set ENABLE_PROD_DEPLOY=true to enable."
              echo "Skipping production deploy — preprod not yet validated."
              exit 0
            fi
            echo "Production deploys are ENABLED."
          fi

          # ── Deploy via Coolify ─────────────────────────────────────────────
          echo "Triggering Coolify deploy..."
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -euo pipefail
            cd '${DEPLOY_PATH}'
            DEPLOY_ENV='${DEPLOY_ENV}' \
            IMAGE_FULL='${IMAGE_FULL}' \
            COOLIFY_APP_UUID='${COOLIFY_APP_UUID}' \
            COOLIFY_API_TOKEN='${{ secrets.COOLIFY_API_TOKEN }}' \
            bash devops/scripts/docker-infra/coolify-deploy.sh \
              --app api \
              --image '${IMAGE_FULL}' \
              --wait \
              --force
          "

          echo "Coolify deploy complete for ${DEPLOY_ENV}"

      - name: Record deploy status
        id: status
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB: post-deploy — Verify deployment health + trigger success backup
  # ============================================================================
  post-deploy:
    name: "Post-Deploy (Verify + Backup)"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: resolve
        run: |
          DEPLOY_ENV="${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}"
          API_SUBDOMAIN="${{ github.ref == 'refs/heads/main' && vars.API_SUBDOMAIN || vars.API_SUBDOMAIN }}"
          DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
          echo "deploy_env=${DEPLOY_ENV}" >> $GITHUB_OUTPUT
          echo "api_subdomain=${API_SUBDOMAIN}" >> $GITHUB_OUTPUT
          echo "deploy_path=${DEPLOY_PATH}" >> $GITHUB_OUTPUT

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Verify deployment on VPS
        id: verify
        env:
          SSH_OPTS: ${{ vars.SSH_OPTS || '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' }}
          DEPLOY_PATH: ${{ steps.resolve.outputs.deploy_path }}
          CONTAINER_PREFIX: ${{ github.ref == 'refs/heads/main' && 'latest-' || 'preprod-' }}
          VPS_API_PORT: ${{ github.ref == 'refs/heads/main' && '8088' || '8090' }}
          DEPLOY_ENV: ${{ steps.resolve.outputs.deploy_env }}
        run: |
          echo "Running post-deploy verification (env: ${DEPLOY_ENV})..."
          echo "CONTAINER_PREFIX=${CONTAINER_PREFIX}"

          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd '${DEPLOY_PATH}' && \
            BASE_DIR='${DEPLOY_PATH}' \
            CONTAINER_PREFIX='${CONTAINER_PREFIX}' \
            DEPLOY_ENV='${DEPLOY_ENV}' \
            VPS_API_PORT='${VPS_API_PORT}' \
            bash devops/scripts/docker-infra/verify.sh deployment
          " && echo "verified=true" >> $GITHUB_OUTPUT || echo "verified=false" >> $GITHUB_OUTPUT

      - name: Trigger success backup on VPS
        if: ${{ steps.verify.outputs.verified == 'true' }}
        env:
          SSH_OPTS: ${{ vars.SSH_OPTS || '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' }}
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${DEPLOY_PATH}' && BASE_DIR='${DEPLOY_PATH}' bash devops/scripts/docker-infra/backup.sh success"

  # ============================================================================
  # JOB: failure-recovery — Roll back after deployment or verification failure
  # ============================================================================
  failure-recovery:
    name: "Failure Recovery"
    runs-on: ubuntu-latest
    needs: [deploy, post-deploy]
    if: always() && (needs.deploy.result == 'failure' || needs.post-deploy.result == 'failure')
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Trigger VPS incident recovery
        env:
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${DEPLOY_PATH}' && BASE_DIR='${DEPLOY_PATH}' bash devops/scripts/docker-infra/incident-response.sh deployment-failed"
