services:
  api:
    image: ${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:preprod}
    container_name: api-ix9fceaxa914diauokjleeis
    hostname: api
    env_file:
      - /opt/healthcare-preprod/.env.preprod
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@maxa5uf95pbau93eslhisek0:5432/userdb_preprod?schema=public'
      DRAGONFLY_KEY_PREFIX: 'preprod:'
      CACHE_PREFIX: 'preprod:'
      NODE_ENV: production
      APP_MODE: api
      SERVICE_NAME: api
      DEV_MODE: 'false'
      DOCKER_ENV: 'true'
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      PORT: 8088
      HOST: 0.0.0.0
      PRISMA_SCHEMA_PATH: /app/src/libs/infrastructure/database/prisma/schema.prisma
      CACHE_PROVIDER: dragonfly
      CACHE_ENABLED: 'true'
      DRAGONFLY_ENABLED: 'true'
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379
      ENABLE_HTTP2: 'false'
      TRUST_PROXY: 1
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: 'true'
      SECURITY_RATE_LIMIT: 'true'
      SECURITY_RATE_LIMIT_MAX: 4000
      SECURITY_RATE_LIMIT_WINDOW_MS: 1000
      CACHE_TTL: 3600
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 600
      API_RATE_LIMIT: 1000
      AUTH_RATE_LIMIT: 30
      HEAVY_RATE_LIMIT: 50
      USER_RATE_LIMIT: 500
      HEALTH_RATE_LIMIT: 2000
      NPM_CONFIG_LOGLEVEL: error
      COOLIFY_RESOURCE_UUID: ix9fceaxa914diauokjleeis
      COOLIFY_CONTAINER_NAME: api-ix9fceaxa914diauokjleeis
      COOLIFY_FQDN: preprod-backend.ishswami.in
      COOLIFY_URL: 'https://preprod-backend.ishswami.in'
      SERVICE_NAME_API: api
      SERVICE_NAME_WORKER: worker
      SERVICE_NAME_PREPROD_NGINX: preprod-nginx
    expose:
      - '8088'
    ports:
      - '8091:8088'
    volumes:
      - /data/coolify/services/logs:/app/logs
    networks:
      preprod-network: null
      ix9fceaxa914diauokjleeis: null
      coolify: null
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - 'http://localhost:8088/infra-health'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    labels:
      - com.docker.compose.service=api
      - env=preprod
      - app.component=backend
      - app.type=api
      - coolify.managed=true
      - coolify.version=4.3.2
      - coolify.serviceId=3
      - coolify.type=service
      - coolify.name=api-ix9fceaxa914diauokjleeis
      - coolify.resourceName=docker-api-worker-nginx
      - coolify.projectName=healthcarebackend
      - coolify.serviceName=api
      - coolify.environmentName=pre-production
      - coolify.pullRequestId=0
      - coolify.service.subId=9
      - coolify.service.subType=application
      - coolify.service.subName=api
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-ix9fceaxa914diauokjleeis-api-8a5d.entrypoints=http
      - traefik.http.routers.http-0-ix9fceaxa914diauokjleeis-api-8a5d.middlewares=redirect-to-https
      - 'traefik.http.routers.http-0-ix9fceaxa914diauokjleeis-api-8a5d.rule=Host(`preprod-backend.ishswami.in`) && PathPrefix(`/`)'
      - traefik.http.routers.https-0-ix9fceaxa914diauokjleeis-api-8a5d.entrypoints=https
      - traefik.http.routers.https-0-ix9fceaxa914diauokjleeis-api-8a5d.middlewares=redirect-to-https
      - 'traefik.http.routers.https-0-ix9fceaxa914diauokjleeis-api-8a5d.rule=Host(`preprod-backend.ishswami.in`) && PathPrefix(`/`)'
      - traefik.http.routers.https-0-ix9fceaxa914diauokjleeis-api-8a5d.tls.certresolver=letsencrypt
      - traefik.http.routers.https-0-ix9fceaxa914diauokjleeis-api-8a5d.tls=true

  worker:
    image: '${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:preprod}'
    container_name: worker-ix9fceaxa914diauokjleeis
    hostname: worker
    env_file:
      - /opt/healthcare-preprod/.env.preprod
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@maxa5uf95pbau93eslhisek0:5432/userdb_preprod?schema=public'
      DRAGONFLY_KEY_PREFIX: 'preprod:'
      CACHE_PREFIX: 'preprod:'
      NODE_ENV: production
      APP_MODE: worker
      SERVICE_NAME: worker
      DEV_MODE: 'false'
      DOCKER_ENV: 'true'
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      CACHE_PROVIDER: dragonfly
      CACHE_ENABLED: 'true'
      DRAGONFLY_ENABLED: 'true'
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379
      BULL_WORKER_CONCURRENCY: '10'
      BULL_MAX_JOBS_PER_WORKER: '100'
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: 'true'
      ENABLE_BULL_BOARD: 'true'
      BULL_BOARD_URL: /queue-dashboard
      ENABLE_HTTP2: 'false'
      COOLIFY_RESOURCE_UUID: ix9fceaxa914diauokjleeis
      COOLIFY_CONTAINER_NAME: worker-ix9fceaxa914diauokjleeis
      SERVICE_NAME_API: api
      SERVICE_NAME_WORKER: worker
      SERVICE_NAME_PREPROD_NGINX: preprod-nginx
    volumes:
      - /data/coolify/services/logs:/app/logs
    ports:
      - '8092:8088'
    networks:
      preprod-network: null
      ix9fceaxa914diauokjleeis: null
      coolify: null
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - process.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    command:
      - node
      - dist/worker-bootstrap.js
    labels:
      - com.docker.compose.service=worker
      - env=preprod
      - app.component=worker
      - app.type=worker
      - coolify.managed=true
      - coolify.version=4.3.2
      - coolify.serviceId=3
      - coolify.type=service
      - coolify.name=worker-ix9fceaxa914diauokjleeis
      - coolify.resourceName=docker-api-worker-nginx
      - coolify.projectName=healthcarebackend
      - coolify.serviceName=worker
      - coolify.environmentName=pre-production
      - coolify.pullRequestId=0
      - coolify.service.subId=10
      - coolify.service.subType=application
      - coolify.service.subName=worker
      # Traefik routing: /queue-dashboard/* → worker (Bull Board only on worker)
      # Priority 100 ensures this router wins over the API catch-all (PathPrefix `/`)
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - 'traefik.http.routers.http-queue-dashboard.entrypoints=http'
      - traefik.http.routers.http-queue-dashboard.middlewares=redirect-to-https
      - 'traefik.http.routers.http-queue-dashboard.rule=Host(`preprod-backend.ishswami.in`) && PathPrefix(`/queue-dashboard`)'
      - traefik.http.routers.http-queue-dashboard.priority=100
      - traefik.http.routers.https-queue-dashboard.entrypoints=https
      - traefik.http.routers.https-queue-dashboard.middlewares=redirect-to-https
      - 'traefik.http.routers.https-queue-dashboard.rule=Host(`preprod-backend.ishswami.in`) && PathPrefix(`/queue-dashboard`)'
      - traefik.http.routers.https-queue-dashboard.priority=100
      - traefik.http.routers.https-queue-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.https-queue-dashboard.tls=true
      - traefik.http.services.queue-dashboard.loadbalancer.server.port=8088

networks:
  preprod-network:
    name: preprod-network
    external: true
  ix9fceaxa914diauokjleeis:
    name: ix9fceaxa914diauokjleeis
    external: true
  coolify:
    name: coolify
    external: true
