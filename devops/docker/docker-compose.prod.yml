# docker-compose.prod.yml — Production environment services
# Dynamic configuration via env vars; same logic as docker-compose.preprod.yml.
# Container prefix resolves to "latest-" for production, "preprod-" for preprod.
# Networks: no static IPs (resolved by Docker DNS); ICC disabled per-network.
# ============================================================================

services:
  # DATABASE - PostgreSQL 18 (production)
  postgres:
    image: postgres:18
    container_name: ${CONTAINER_PREFIX:-latest-}postgres
    hostname: postgres
    volumes:
      - ${CONTAINER_PREFIX:-latest_}postgres_data:/var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: userdb
      POSTGRES_MAX_CONNECTIONS: 120
      POSTGRES_SHARED_BUFFERS: 2GB
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      app-network:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d userdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 10G
        reservations:
          cpus: "1.5"
          memory: 3G
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 1m
    command: >
      postgres
        -c max_connections=120
        -c shared_buffers=2GB
        -c effective_cache_size=12GB
        -c maintenance_work_mem=256MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=32MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=16MB
        -c min_wal_size=2GB
        -c max_wal_size=8GB
        -c max_worker_processes=8
        -c max_parallel_workers_per_gather=4
        -c max_parallel_workers=8
        -c max_parallel_maintenance_workers=4
        -c idle_in_transaction_session_timeout=60000
        -c statement_timeout=60000
        -c lock_timeout=60000
        -c listen_addresses='*'
        -c log_connections=on
        -c log_disconnections=on
        -c tcp_keepalives_idle=60
        -c tcp_keepalives_interval=10
        -c tcp_keepalives_count=3
    labels:
      - "com.docker.compose.service=postgres"
      - "env=production"
      - "app.component=database"
      - "app.type=postgres"
      - "app.healthcheck=enabled"
      - "app.persist=true"

  # CACHE - DragonflyDB (production)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: ${CONTAINER_PREFIX:-latest-}dragonfly
    hostname: dragonfly
    command: >
      --alsologtostderr
      --cache_mode=false
      --maxmemory=4gb
      --proactor_threads=6
      --logtostderr
      --default_lua_flags=allow-undeclared-keys
    volumes:
      - ${CONTAINER_PREFIX:-latest_}dragonfly_data:/data
    networks:
      app-network:
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -p 6379 ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    restart: unless-stopped
    sysctls:
      net.core.somaxconn: 2048
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - "com.docker.compose.service=dragonfly"
      - "env=production"
      - "app.component=cache"
      - "app.type=dragonfly"
      - "app.healthcheck=enabled"

  # ROUTER — Nginx (production, zero-downtime gateway)
  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-latest-}nginx
    hostname: nginx
    ports:
      - "${NGINX_PORT:-8088}:${NGINX_PORT:-8088}"
    volumes:
      - ${DEPLOY_PATH:-/opt/healthcare-backend}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEPLOY_PATH:-/opt/healthcare-backend}/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf
      - ${DEPLOY_PATH:-/opt/healthcare-backend}/logs/nginx:/var/log/nginx
    networks:
      app-network:
      coolify:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    labels:
      - "com.docker.compose.service=nginx"
      - "env=production"
      - "app.component=router"
      - "app.type=nginx"
      - "traefik.enable=true"
      - "traefik.http.routers.healthcare-api.rule=Host(\`backend-service-v1.ishswami.in\`)"
      - "traefik.http.routers.healthcare-api.entrypoints=http,https"
      - "traefik.http.routers.healthcare-api.tls=true"
      - "traefik.http.services.healthcare-api.loadbalancer.server.port=${NGINX_PORT:-8088}"
      - "traefik.docker.network=coolify"

  # API - NestJS Backend (production)
  api:
    image: ${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:latest}
    container_name: ${CONTAINER_PREFIX:-latest-}api
    hostname: api
    env_file:
      - ${DEPLOY_PATH:-/opt/healthcare-backend}/.env.production
    volumes:
      - ${DEPLOY_PATH:-/opt/healthcare-backend}/logs:/app/logs
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      NODE_ENV: production
      DEV_MODE: "false"
      DOCKER_ENV: "true"
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      ENABLE_HTTP2: "false"
      CACHE_PROVIDER: dragonfly
      DRAGONFLY_ENABLED: "true"
      DRAGONFLY_HOST: ${CONTAINER_PREFIX:-latest-}dragonfly
      DRAGONFLY_PORT: 6379
      DRAGONFLY_KEY_PREFIX: "healthcare:"
      TRUST_PROXY: 1
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: "true"
      SECURITY_RATE_LIMIT: "true"
      SECURITY_RATE_LIMIT_MAX: 4000
      SECURITY_RATE_LIMIT_WINDOW_MS: 1000
      CACHE_TTL: 3600
      CACHE_PREFIX: "healthcare:"
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 600
      API_RATE_LIMIT: 1000
      AUTH_RATE_LIMIT: 30
      HEAVY_RATE_LIMIT: 50
      USER_RATE_LIMIT: 500
      HEALTH_RATE_LIMIT: 2000
      NPM_CONFIG_LOGLEVEL: error
    expose:
      - "${API_PORT:-8088}"
    networks:
      app-network:
        aliases:
          - backend-service-v1.ishswami.in
    extra_hosts:
      - "api:${CONTAINER_PREFIX:-latest-}api"
      - "postgres:${CONTAINER_PREFIX:-latest-}postgres"
      - "dragonfly:${CONTAINER_PREFIX:-latest-}dragonfly"
      - "worker:${CONTAINER_PREFIX:-latest-}worker"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${API_PORT:-8088}/infra-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 8G
        reservations:
          cpus: "1.5"
          memory: 2G
    labels:
      - "com.docker.compose.service=api"
      - "env=production"
      - "app.component=backend"
      - "app.type=api"

  # WORKER - Background Job Processor (production)
  worker:
    image: ${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:latest}
    container_name: ${CONTAINER_PREFIX:-latest-}worker
    hostname: worker
    env_file:
      - ${DEPLOY_PATH:-/opt/healthcare-backend}/.env.production
    environment:
      NODE_ENV: production
      APP_MODE: worker
      SERVICE_NAME: worker
      DEV_MODE: "false"
      DOCKER_ENV: "true"
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      PORT: 8080
      HOST: 0.0.0.0
      CACHE_PROVIDER: dragonfly
      CACHE_ENABLED: "true"
      DRAGONFLY_ENABLED: "true"
      DRAGONFLY_HOST: ${CONTAINER_PREFIX:-latest-}dragonfly
      DRAGONFLY_PORT: 6379
      DRAGONFLY_KEY_PREFIX: "healthcare:"
      BULL_WORKER_CONCURRENCY: "10"
      BULL_MAX_JOBS_PER_WORKER: "100"
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: "true"
      ENABLE_BULL_BOARD: "true"
      BULL_BOARD_URL: ${BULL_BOARD_URL:-/queue-dashboard}
      QUEUE_DASHBOARD_USER: ${QUEUE_DASHBOARD_USER:-bullboard_admin}
      QUEUE_DASHBOARD_PASSWORD: ${QUEUE_DASHBOARD_PASSWORD}
    volumes:
      - ${DEPLOY_PATH:-/opt/healthcare-backend}/logs:/app/logs
    ports:
      - "9090:8080"
    networks:
      app-network:
        aliases:
          - worker.ishswami.in
    extra_hosts:
      - "worker:${CONTAINER_PREFIX:-latest-}worker"
      - "postgres:${CONTAINER_PREFIX:-latest-}postgres"
      - "dragonfly:${CONTAINER_PREFIX:-latest-}dragonfly"
      - "api:${CONTAINER_PREFIX:-latest-}api"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
        required: false
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/worker-bootstrap.js", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    command: ["node", "dist/worker-bootstrap.js"]
    labels:
      - "com.docker.compose.service=worker"
      - "env=production"
      - "app.component=worker"
      - "app.type=worker"

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_PATH:-/opt/healthcare-backend}/data/postgres
  dragonfly_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_PATH:-/opt/healthcare-backend}/data/dragonfly

networks:
  app-network:
    name: app-network
    ipam:
      config:
        - subnet: ${PROD_SUBNET:-172.18.0.0/16}
  coolify:
    external: true
