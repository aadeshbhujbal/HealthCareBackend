services:
  api:
    image: '${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:latest}'
    container_name: api-5sdkic5wk4l6zpflypayt9mb
    hostname: api
    env_file:
      - /opt/healthcare-backend/.env.production
      - .env
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@maxa5uf95pbau93eslhisek0:5432/userdb?schema=public'
      DRAGONFLY_KEY_PREFIX: 'healthcare:'
      CACHE_PREFIX: 'healthcare:'
      NODE_ENV: production
      APP_MODE: api
      SERVICE_NAME: api
      DEV_MODE: 'false'
      DOCKER_ENV: 'true'
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      PORT: 8088
      HOST: 0.0.0.0
      PRISMA_SCHEMA_PATH: /app/src/libs/infrastructure/database/prisma/schema.prisma
      CACHE_PROVIDER: dragonfly
      CACHE_ENABLED: 'true'
      DRAGONFLY_ENABLED: 'true'
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379
      JWT_SECRET: '${JWT_SECRET}'
      ENABLE_HTTP2: 'false'
      TRUST_PROXY: 1
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: 'true'
      SECURITY_RATE_LIMIT: 'true'
      SECURITY_RATE_LIMIT_MAX: 4000
      SECURITY_RATE_LIMIT_WINDOW_MS: 1000
      CACHE_TTL: 3600
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 600
      API_RATE_LIMIT: 1000
      AUTH_RATE_LIMIT: 30
      HEAVY_RATE_LIMIT: 50
      USER_RATE_LIMIT: 500
      HEALTH_RATE_LIMIT: 2000
      NPM_CONFIG_LOGLEVEL: error
    expose:
      - '8088'
    ports:
      - '8088:8088'
    volumes:
      - '/data/coolify/services/5sdkic5wk4l6zpflypayt9mb/../logs:/app/logs'
    networks:
      5sdkic5wk4l6zpflypayt9mb: null
      coolify: null
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - 'http://localhost:8088/infra-health'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 8G
        reservations:
          cpus: '1.5'
          memory: 2G
    labels:
      - com.docker.compose.service=api
      - env=production
      - traefik.docker.network=coolify
      - app.component=backend
      - app.type=api
      - coolify.managed=true
      - coolify.version=4.3.2
      - coolify.serviceId=3
      - coolify.type=service
      - coolify.name=api-5sdkic5wk4l6zpflypayt9mb
      - coolify.resourceName=docker-api-worker
      - coolify.projectName=healthcarebackend
      - coolify.serviceName=api
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=9
      - coolify.service.subType=application
      - coolify.service.subName=api

  worker:
    image: '${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:latest}'
    container_name: worker-5sdkic5wk4l6zpflypayt9mb
    hostname: worker
    env_file:
      - /opt/healthcare-backend/.env.production
      - .env
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@maxa5uf95pbau93eslhisek0:5432/userdb?schema=public'
      DRAGONFLY_KEY_PREFIX: 'healthcare:'
      CACHE_PREFIX: 'healthcare:'
      NODE_ENV: production
      APP_MODE: worker
      SERVICE_NAME: worker
      DEV_MODE: 'false'
      DOCKER_ENV: 'true'
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      CACHE_PROVIDER: dragonfly
      CACHE_ENABLED: 'true'
      DRAGONFLY_ENABLED: 'true'
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379
      BULL_WORKER_CONCURRENCY: '10'
      BULL_MAX_JOBS_PER_WORKER: '100'
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: 'true'
      ENABLE_BULL_BOARD: 'true'
      BULL_BOARD_URL: /queue-dashboard
      COOLIFY_RESOURCE_UUID: 5sdkic5wk4l6zpflypayt9mb
      COOLIFY_CONTAINER_NAME: worker-5sdkic5wk4l6zpflypayt9mb
      COOLIFY_FQDN: backend-service-v1.ishswami.in
      COOLIFY_URL: 'https://backend-service-v1.ishswami.in'
      BASE_URL: 'https://backend-service-v1.ishswami.in'
      SERVICE_NAME_API: api
      SERVICE_NAME_WORKER: worker
    volumes:
      - '/data/coolify/services/5sdkic5wk4l6zpflypayt9mb/../logs:/app/logs'
    ports:
      - '8089:8088'
    networks:
      5sdkic5wk4l6zpflypayt9mb: null
      coolify: null
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - process.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    command:
      - node
      - dist/worker-bootstrap.js
    labels:
      - com.docker.compose.service=worker
      - env=production
      - app.component=worker
      - app.type=worker
      - coolify.managed=true
      - coolify.version=4.3.2
      - coolify.serviceId=3
      - coolify.type=service
      - coolify.name=worker-5sdkic5wk4l6zpflypayt9mb
      - coolify.resourceName=docker-api-worker
      - coolify.projectName=healthcarebackend
      - coolify.serviceName=worker
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=10
      - coolify.service.subType=application
      - coolify.service.subName=worker
      # Traefik routing: /queue-dashboard/* goes to worker container
      # Priority 100 ensures this router wins over the API catch-all (PathPrefix `/`)
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.queue-dashboard.rule=Host(`backend-service-v1.ishswami.in`) && PathPrefix(`/queue-dashboard`)
      - traefik.http.routers.queue-dashboard.priority=100
      - traefik.http.routers.queue-dashboard.entrypoints=https
      - traefik.http.routers.queue-dashboard.tls=true
      - traefik.http.services.queue-dashboard.loadbalancer.server.port=8088

networks:
  5sdkic5wk4l6zpflypayt9mb:
    name: 5sdkic5wk4l6zpflypayt9mb
    external: true
  coolify:
    name: coolify
    external: true
